<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram Publications Downloader</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="container">
    <h1>Telegram Publications Downloader</h1>
    <p class="intro">
      Build the command to request a PDF from your Telegram bot.
    </p>

    <form id="download-form" novalidate>
      <label for="url-input">Publication page URL</label>
      <input
        id="url-input"
        name="url"
        type="url"
        placeholder="https://www.sciencedirect.com/..."
        required
      />
      <button type="submit">Generate command</button>
    </form>

    <section id="result" class="result" aria-live="polite"></section>

    <section class="supported">
      <h2>Supported services</h2>
      <ul>
        <li>ScienceDirect</li>
        <li>IEEE Xplore</li>
      </ul>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
